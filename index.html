<!DOCTYPE html>
<html>
<head>
  <title>📚 BookNook</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📚 BookNook Store</h1>

<input type="text" id="search" placeholder="Search books..." onkeyup="searchBooks()">

<select onchange="filterCategory(this.value)">
  <option value="all">All</option>
  <option value="fiction">Fiction</option>
  <option value="nonfiction">Non-Fiction</option>
  <option value="stationery">Stationery</option>
</select>

<div class="products" id="product-list">

  <!-- Fiction -->
  <div class="card fiction">
    <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=400&q=80">
    <h3>The Great Gatsby</h3>
    <p>$12</p>
    <button onclick="addToCart('The Great Gatsby',12)">Add</button>
  </div>

  <div class="card fiction">
    <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=400&q=80">
    <h3>Harry Potter</h3>
    <p>$15</p>
    <button onclick="addToCart('Harry Potter',15)">Add</button>
  </div>

  <!-- Non-Fiction -->
  <div class="card nonfiction">
    <img src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=400&q=80">
    <h3>Sapiens</h3>
    <p>$18</p>
    <button onclick="addToCart('Sapiens',18)">Add</button>
  </div>

  <!-- Stationery -->
  <div class="card stationery">
    <img src="https://images.unsplash.com/photo-1586075010923-2dd4570fb338?auto=format&fit=crop&w=400&q=80">
    <h3>Notebook</h3>
    <p>$5</p>
    <button onclick="addToCart('Notebook',5)">Add</button>
  </div>

</div>

<hr>

<h2>🛒 Cart (<span id="count">0</span>)</h2>
<ul id="cart"></ul>

<h3>Total: $<span id="total">0</span></h3>

<script src="script.js"></script>

</body>
</html>
